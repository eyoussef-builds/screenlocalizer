<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<!-- macOS icon grid: 824×824 rounded square centred on a 1024 canvas, with a soft drop shadow. -->
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6ff5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1b1446" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>
  <!-- Large bubble with Arabic letter ain -->
  <path d="M232 300 a72 72 0 0 1 72 -72 h292 a72 72 0 0 1 72 72 v196 a72 72 0 0 1 -72 72 h-252 l-112 98 z" fill="#ffffff"/>
  <text x="450" y="482" font-size="230" font-weight="bold" fill="#6366f1" text-anchor="middle"
        font-family="'Geeza Pro','Noto Naskh Arabic',sans-serif">ع</text>
  <!-- Small bubble with Latin A -->
  <rect x="520" y="520" width="290" height="236" rx="58" fill="#a99bf8" stroke="#ffffff" stroke-width="26"/>
  <path d="M740 750 l58 72 v-86 z" fill="#ffffff"/>
  <text x="665" y="706" font-size="172" font-weight="bold" fill="#ffffff" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif">A</text>
</svg>
</body>
</html>
